<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>노력하는 김집사 홈케어</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;color:#1b150f;background:#fff}
.wrap{max-width:1400px;margin:auto}.fixed{position:relative}.fixed img{display:block;width:100%;height:auto}
.hot{position:absolute;z-index:5;border:0;background:transparent;cursor:pointer}
#phone{left:76.5%;top:1%;width:12.5%;height:3.4%}#kakao{left:89.2%;top:1%;width:10.3%;height:3.4%}
.p{border-radius:999px}.p:hover,.hot:hover{outline:3px solid rgba(255,191,0,.55)}
#p1{left:4%;top:55.5%;width:11.5%;height:12.6%}#p2{left:19%;top:55.5%;width:11.5%;height:12.6%}
#p3{left:34.7%;top:55.5%;width:11.5%;height:12.6%}#p4{left:50.8%;top:55.5%;width:11.5%;height:12.6%}
#p5{left:66.6%;top:55.5%;width:11.5%;height:12.6%}#p6{left:82.3%;top:55.5%;width:11.5%;height:12.6%}
.dock{position:sticky;bottom:8px;z-index:30;display:flex;gap:8px;justify-content:center;padding:8px}
.dock a{background:#fff;border:1px solid #ddd;border-radius:999px;padding:11px 14px;font-weight:800;box-shadow:0 3px 16px #0002}
.dock a.y{background:#ffbf00}.dynamic{max-width:1180px;margin:auto;padding:22px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{border:1px solid #eadfce;border-radius:16px;padding:12px;background:#fff}.card img,.card video{width:100%;border-radius:12px}.txt{white-space:pre-wrap;line-height:1.55}
.empty{padding:20px;border:1px dashed #bbb;border-radius:14px;color:#777}.admin{text-align:center;padding:24px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:100;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}
.modal>div{background:#111;padding:12px;border-radius:16px;width:min(900px,96vw);position:relative}.modal video{width:100%;max-height:80vh}
.close{position:absolute;right:14px;top:14px;width:42px;height:42px;border-radius:50%;border:0;font-size:24px}
@media(max-width:700px){.dock{justify-content:flex-start;overflow:auto}.dock a{white-space:nowrap;font-size:13px}.dynamic{padding:14px}}
</style></head><body><div class="wrap">
<div class="fixed"><img src="fixed-design.png" alt="노력하는 김집사 홈케어 고정 디자인">
<a id="phone" class="hot" href="tel:01033857516" aria-label="전화상담"></a>
<a id="kakao" class="hot" href="#" target="_blank" aria-label="카카오톡상담"></a>
<button id="p1" class="hot p"></button><button id="p2" class="hot p"></button><button id="p3" class="hot p"></button>
<button id="p4" class="hot p"></button><button id="p5" class="hot p"></button><button id="p6" class="hot p"></button>
</div>
<div class="dock"><a class="y" id="dphone" href="tel:01033857516">☎ 전화</a><a class="y" id="dkakao" href="#">TALK 카카오톡</a><a id="dcoupang" href="#">쿠팡플레이스</a><a id="dyoutube" href="#">YouTube</a><a id="dinstagram" href="#">Instagram</a></div>
<section class="dynamic"><h2>📸 새 작업 사진 · 영상</h2><div id="gallery" class="cards"></div><h2>✍️ 새 소식</h2><div id="posts" class="cards"></div></section>
<div class="admin"><a href="admin.html">관리자 페이지</a></div></div>
<div class="modal" id="modal"><div><button class="close" onclick="closeV()">×</button><video id="mv" controls playsinline></video></div></div>
<script>
let D={};const q=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){try{D=await fetch('content.json?'+Date.now()).then(r=>r.json())}catch(e){D={}}
if(D.phone){q('#phone').href=q('#dphone').href='tel:'+D.phone.replace(/\D/g,'')}
for(const [id,k] of [['#kakao','kakao'],['#dkakao','kakao'],['#dcoupang','coupang_place'],['#dyoutube','youtube'],['#dinstagram','instagram']])q(id).href=D[k]||'#';
render()}
function render(){let g=D.gallery||[];q('#gallery').innerHTML=g.length?g.map(x=>`<article class="card">${x.type==='video'?`<video src="${x.url}" controls playsinline></video>`:`<img src="${x.url}">`}<div class="txt">${esc(x.caption||'')}</div></article>`).join(''):'<div class="empty">관리자 페이지에서 사진이나 영상을 올리면 여기에 표시됩니다.</div>';
let p=D.posts||[];q('#posts').innerHTML=p.length?p.map(x=>`<article class="card"><b>${esc(x.title||'')}</b><div class="txt">${esc(x.body||'')}</div></article>`).join(''):'<div class="empty">관리자 페이지에서 글을 작성하면 여기에 표시됩니다.</div>'}
for(let i=0;i<6;i++)document.getElementById('p'+(i+1)).onclick=()=>openV(i);
function openV(i){let u=(D.process_videos||[])[i];if(!u){alert('관리자 페이지에서 이 청소과정 영상을 먼저 등록해주세요.');return}q('#mv').src=u;q('#modal').classList.add('on');q('#mv').play().catch(()=>{})}
function closeV(){q('#mv').pause();q('#mv').src='';q('#modal').classList.remove('on')}q('#modal').onclick=e=>{if(e.target.id==='modal')closeV()};load();
</script></body></html>
