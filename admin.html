<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>김집사 홈케어 관리자</title><style>body{font-family:Arial,sans-serif;background:#f6f3ec;margin:0;color:#222}.box{max-width:900px;margin:20px auto;background:white;padding:24px;border-radius:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}input,textarea,select,button{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px}textarea{min-height:90px}button{background:#08723b;color:white;font-weight:800;border:0;cursor:pointer}.warn{background:#fff4ce;padding:12px;border-radius:10px}.media{border:1px solid #ddd;padding:12px;border-radius:10px;margin:8px 0}.small{font-size:13px;color:#666}h1{color:#08723b}.danger{background:#8b1b1b}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs a{padding:9px 13px;background:#eee;border-radius:9px;text-decoration:none;color:#222}</style></head><body>
<div class="box"><h1>노력하는 김집사 홈케어 관리자</h1><div class="tabs"><a href="index.html">홈페이지 보기</a></div><p class="warn">이 관리자는 GitHub Pages와 바로 연결해서 쓸 수 있게 만들었습니다. 처음 한 번만 GitHub 토큰을 넣으면 이후 휴대폰에서 사진·영상을 올릴 수 있고, 저장하면 방문자에게도 같은 내용이 보입니다.</p>
<h2>1. GitHub 연결</h2><div class="row"><input id="owner" value="kimhyosang86" placeholder="GitHub 아이디"><input id="repo" value="kimhyosang86.github.io" placeholder="저장소 이름"><input id="branch" value="main" placeholder="브랜치(main)"><input id="token" type="password" placeholder="GitHub 토큰 (이 휴대폰에만 저장)"><button onclick="saveConn()">연결정보 저장</button><button onclick="testConn()">연결 확인</button></div><p class="small">토큰은 홈페이지 파일에 저장하지 않고 이 브라우저에만 보관합니다.</p>
<h2>2. 문구/연락처 수정</h2><div class="row"><input id="brand" class="full" placeholder="업체명"><input id="phone" placeholder="전화번호"><input id="kakao" placeholder="카카오톡 주소"><textarea id="heroLines" class="full" placeholder="메인 문구 - 한 줄에 하나"></textarea><textarea id="reasons" class="full" placeholder="번호 문구 - 한 줄에 하나"></textarea></div>
<h2>3. 메인 고양이 사진</h2><input id="heroFile" type="file" accept="image/*"><button onclick="uploadHero()">메인 사진 올리기</button>
<h2>4. 청소 과정 영상 6개</h2><div id="videos"></div>
<h2>5. 작업 사진·영상 추가</h2><div class="row"><input id="galleryFile" type="file" accept="image/*,video/*"><input id="galleryCaption" placeholder="설명 예: 고양이 소변 얼룩 전/후"><button class="full" onclick="uploadGallery()">작업 사진/영상 추가</button></div><div id="galleryList"></div>
<h2>6. 고객 후기</h2><textarea id="newReview" placeholder="고객 후기 입력"></textarea><button onclick="addReview()">후기 추가</button><div id="reviews"></div>
<br><button onclick="saveContent()">모든 변경사항 저장해서 홈페이지에 공개</button></div>
<script>
let content={};const $=id=>document.getElementById(id);function conn(){return{owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',token:$('token').value.trim()}}function saveConn(){let c=conn();localStorage.setItem('kj_conn',JSON.stringify({...c,token:c.token}));alert('이 휴대폰에 연결정보를 저장했습니다.')}function loadConn(){let c=JSON.parse(localStorage.getItem('kj_conn')||'{}');for(let k of ['owner','repo','branch','token'])if(c[k])$(k).value=c[k]}
async function gh(path,method='GET',body){let c=conn();let r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}${method==='GET'?`?ref=${c.branch}&t=${Date.now()}`:''}`,{method,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+c.token,'X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error((await r.json()).message||r.status);return r.json()}
async function testConn(){try{await gh('content.json');alert('연결 성공! 이제 사진과 영상을 올릴 수 있습니다.')}catch(e){alert('연결 실패: '+e.message)}}
async function getContent(){try{content=await fetch('content.json?'+Date.now()).then(r=>r.json())}catch{content={processVideos:['','','','','',''],gallery:[],reviews:[]}};content.processVideos=content.processVideos||['','','','','',''];content.gallery=content.gallery||[];content.reviews=content.reviews||[];fill()}
function fill(){$('brand').value=content.brand||'';$('phone').value=content.phone||'';$('kakao').value=content.kakao||'';$('heroLines').value=(content.heroLines||[]).join('\n');$('reasons').value=(content.reasons||[]).join('\n');$('videos').innerHTML=[0,1,2,3,4,5].map(i=>`<div class="media"><b>${i+1}번 과정 영상</b><input id="v${i}" type="file" accept="video/*"><button onclick="uploadProcess(${i})">영상 올리기</button><div class="small">${content.processVideos[i]?'현재 영상 있음':'아직 영상 없음'}</div></div>`).join('');renderLists()}
function renderLists(){$('galleryList').innerHTML=(content.gallery||[]).map((x,i)=>`<div class="media">${x.caption||x.url}<button class="danger" onclick="content.gallery.splice(${i},1);renderLists()">삭제</button></div>`).join('');$('reviews').innerHTML=(content.reviews||[]).map((x,i)=>`<div class="media">${x}<button class="danger" onclick="content.reviews.splice(${i},1);renderLists()">삭제</button></div>`).join('')}
async function uploadFile(file,prefix){if(!file)throw new Error('파일을 선택해주세요.');let ext=(file.name.split('.').pop()||'bin').replace(/[^a-zA-Z0-9]/g,'');let name=`assets/uploads/${prefix}-${Date.now()}.${ext}`;let b64=await new Promise((res,rej)=>{let fr=new FileReader();fr.onload=()=>res(fr.result.split(',')[1]);fr.onerror=rej;fr.readAsDataURL(file)});await gh(name,'PUT',{message:'김집사 홈케어 미디어 업로드',content:b64,branch:conn().branch});return name}
async function uploadHero(){try{let p=await uploadFile($('heroFile').files[0],'hero');content.heroPhoto=p;await saveContent();alert('메인 사진을 바꿨습니다.')}catch(e){alert(e.message)}}
async function uploadProcess(i){try{let p=await uploadFile($('v'+i).files[0],`process-${i+1}`);content.processVideos[i]=p;await saveContent();fill();alert('영상이 올라갔습니다.')}catch(e){alert(e.message)}}
async function uploadGallery(){try{let f=$('galleryFile').files[0];let p=await uploadFile(f,'work');content.gallery.push({url:p,type:f.type.startsWith('video')?'video':'image',caption:$('galleryCaption').value.trim()});await saveContent();$('galleryCaption').value='';renderLists();alert('작업 사진/영상이 공개되었습니다.')}catch(e){alert(e.message)}}
function addReview(){let t=$('newReview').value.trim();if(!t)return;content.reviews.push(t);$('newReview').value='';renderLists()}
async function saveContent(){try{content.brand=$('brand').value.trim();content.phone=$('phone').value.trim();content.kakao=$('kakao').value.trim();content.heroLines=$('heroLines').value.split('\n').map(x=>x.trim()).filter(Boolean);content.reasons=$('reasons').value.split('\n').map(x=>x.trim()).filter(Boolean);let old;try{old=await gh('content.json')}catch{};let bytes=new TextEncoder().encode(JSON.stringify(content,null,2));let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));let b64=btoa(bin);await gh('content.json','PUT',{message:'김집사 홈케어 내용 수정',content:b64,sha:old&&old.sha,branch:conn().branch});alert('저장 완료. 잠시 후 홈페이지 방문자에게도 보입니다.')}catch(e){alert('저장 실패: '+e.message)}}loadConn();getContent();
</script></body></html>
