<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>김집사 홈케어 관리자</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ee;font-family:Arial,"Noto Sans KR",sans-serif}main{max-width:900px;margin:auto;padding:16px}
.box{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin:14px 0}label{display:block;font-weight:800;margin:10px 0 5px}
input,textarea,select,button{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font:inherit}textarea{min-height:110px}button{background:#ffbf00;border:0;font-weight:900;margin-top:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ok{color:#08723b}.err{color:#b33}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style></head><body><main><h1>🐾 김집사 홈케어 관리자</h1>
<div class="box"><b>GitHub 저장소에 직접 저장하는 관리자입니다.</b><p>저장소 <b>kimhyosang86/Kimjipsahomecare</b>에 Contents: Read and write 권한이 있는 Fine-grained Personal Access Token을 입력하세요. 토큰은 저장하지 않습니다.</p>
<label>GitHub 토큰</label><input id="token" type="password" placeholder="github_pat_..."><div id="st"></div></div>
<div class="box"><h2>연결 주소</h2><div class="row"><div><label>카카오톡</label><input id="kakao"></div><div><label>쿠팡플레이스</label><input id="coupang"></div></div>
<div class="row"><div><label>YouTube</label><input id="youtube"></div><div><label>Instagram</label><input id="instagram"></div></div><button onclick="saveLinks()">주소 저장</button></div>
<div class="box"><h2>청소과정 영상</h2><select id="step"><option value="0">1. 오염확인</option><option value="1">2. 전문장비 청소</option><option value="2">3. 친환경 세제 분사</option><option value="3">4. 얼룩 제거</option><option value="4">5. 고온 살균</option><option value="5">6. 자연 건조</option></select>
<label>영상 파일</label><input id="pf" type="file" accept="video/*"><button onclick="uploadProcess()">영상 올리기</button></div>
<div class="box"><h2>작업 사진·영상 올리기</h2><input id="mf" type="file" accept="image/*,video/*"><label>설명</label><textarea id="cap"></textarea><button onclick="uploadGallery()">올리기</button></div>
<div class="box"><h2>글 쓰기</h2><label>제목</label><input id="pt"><label>내용</label><textarea id="pb"></textarea><button onclick="addPost()">글 올리기</button></div>
<div class="box"><a href="index.html">← 홈페이지로</a></div></main>
<script>
const OWNER='kimhyosang86',REPO='Kimjipsahomecare',BRANCH='main';let D={phone:'010-3385-7516',kakao:'#',youtube:'#',instagram:'#',coupang_place:'#',process_videos:['','','','','',''],gallery:[],posts:[]};
const $=id=>document.getElementById(id);function msg(s,ok=1){$('st').innerHTML='<p class="'+(ok?'ok':'err')+'">'+s+'</p>'}
function H(){let t=$('token').value.trim();if(!t)throw Error('GitHub 토큰을 입력해주세요.');return {'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
async function api(path,opt={}){let r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path,{...opt,headers:{...H(),...(opt.headers||{})}});if(!r.ok)throw Error((await r.json()).message||'GitHub 오류');return r.json()}
async function old(path){try{let j=await api(path);return j.sha}catch(e){if(String(e).includes('Not Found'))return null;throw e}}
async function put(path,b64,m){let sha=await old(path),body={message:m,content:b64,branch:BRANCH};if(sha)body.sha=sha;return api(path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
async function putText(path,text,m){return put(path,btoa(unescape(encodeURIComponent(text))),m)}
async function putFile(path,f,m){let b64=await new Promise((res,rej)=>{let fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(f)});return put(path,b64,m)}
async function save(m){await putText('content.json',JSON.stringify(D,null,2),m);msg('저장 완료. GitHub Pages 반영까지 잠시 걸릴 수 있습니다.')}
async function load(){try{D=await fetch('content.json?'+Date.now()).then(r=>r.json());$('kakao').value=D.kakao||'';$('coupang').value=D.coupang_place||'';$('youtube').value=D.youtube||'';$('instagram').value=D.instagram||''}catch(e){}}
async function saveLinks(){try{D.kakao=$('kakao').value||'#';D.coupang_place=$('coupang').value||'#';D.youtube=$('youtube').value||'#';D.instagram=$('instagram').value||'#';await save('Update links')}catch(e){msg(e.message,0)}}
async function uploadProcess(){try{let f=$('pf').files[0];if(!f)throw Error('영상을 선택해주세요.');let path='media/process/'+Date.now()+'_'+f.name.replace(/[^\w.\-가-힣]/g,'_');await putFile(path,f,'Upload process video');D.process_videos[+$('step').value]=path;await save('Update process video')}catch(e){msg(e.message,0)}}
async function uploadGallery(){try{let f=$('mf').files[0];if(!f)throw Error('파일을 선택해주세요.');let path='media/gallery/'+Date.now()+'_'+f.name.replace(/[^\w.\-가-힣]/g,'_');await putFile(path,f,'Upload gallery media');D.gallery.unshift({type:f.type.startsWith('video')?'video':'image',url:path,caption:$('cap').value});await save('Add gallery item')}catch(e){msg(e.message,0)}}
async function addPost(){try{D.posts.unshift({title:$('pt').value,body:$('pb').value,date:new Date().toISOString()});await save('Add post')}catch(e){msg(e.message,0)}}load();
</script></body></html>
